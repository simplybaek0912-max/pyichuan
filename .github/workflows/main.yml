{
  "name": "Build iOS IPA",
  "on": ["push", "workflow_dispatch"],
  "jobs": {
    "build": {
      "runs-on": "macos-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        {
          "name": "Generate Xcode Project & Build IPA",
          "run": "python3 -c 'import glob,json,pathlib; pathlib.Path(\"Sources\").mkdir(exist_ok=True); code=pathlib.Path(glob.glob(\"*swift*\")[0]).read_text(encoding=\"utf-8\").replace(\"let imageManager = PHCachingImageManager()\",\"lazy var imageManager = PHCachingImageManager()\"); pathlib.Path(\"Sources/SwipePhotoCleaner.swift\").write_text(code,encoding=\"utf-8\"); props={\"CFBundleDevelopmentRegion\":\"zh_CN\",\"CFBundleDisplayName\":\"一划清\",\"CFBundleExecutable\":\"$(EXECUTABLE_NAME)\",\"CFBundleIdentifier\":\"$(PRODUCT_BUNDLE_IDENTIFIER)\",\"CFBundleInfoDictionaryVersion\":\"6.0\",\"CFBundleName\":\"$(PRODUCT_NAME)\",\"CFBundlePackageType\":\"APPL\",\"CFBundleShortVersionString\":\"1.0\",\"CFBundleVersion\":\"1\",\"LSRequiresIPhoneOS\":True,\"NSPhotoLibraryUsageDescription\":\"需要访问相册以进行滑卡清理照片\",\"NSPhotoLibraryAddUsageDescription\":\"需要访问相册以管理照片\",\"UILaunchScreen\":{},\"UIRequiredDeviceCapabilities\":[\"arm64\"],\"UISupportedInterfaceOrientations\":[\"UIInterfaceOrientationPortrait\"]}; pathlib.Path(\"project.yml\").write_text(json.dumps({\"name\":\"SwipePhotoCleaner\",\"options\":{\"bundleIdPrefix\":\"com.selfuse\",\"deploymentTarget\":{\"iOS\":\"16.0\"}},\"targets\":{\"SwipePhotoCleaner\":{\"type\":\"application\",\"platform\":\"iOS\",\"deploymentTarget\":\"16.0\",\"sources\":[\"Sources\"],\"info\":{\"path\":\"Info.plist\",\"properties\":props},\"settings\":{\"base\":{\"GENERATE_INFOPLIST_FILE\":\"NO\",\"INFOPLIST_FILE\":\"Info.plist\",\"PRODUCT_BUNDLE_IDENTIFIER\":\"com.selfuse.swipephotocleaner\",\"MARKETING_VERSION\":\"1.0.0\",\"CURRENT_PROJECT_VERSION\":1,\"SWIFT_VERSION\":\"5.0\",\"TARGETED_DEVICE_FAMILY\":\"1\",\"CODE_SIGN_IDENTITY\":\"\",\"CODE_SIGNING_REQUIRED\":\"NO\",\"CODE_SIGNING_ALLOWED\":\"NO\"}}}}}))' && (which xcodegen || brew install xcodegen) && xcodegen generate && python3 -c 'import pathlib; pathlib.Path(\"Info.plist\").write_text(\"<?xml version=\\x271.0\\x27 encoding=\\x27UTF-8\\x27?><!DOCTYPE plist PUBLIC \\x27-//Apple//DTD PLIST 1.0//EN\\x27 \\x27http://www.apple.com/DTDs/PropertyList-1.0.dtd\\x27><plist version=\\x271.0\\x27><dict><key>CFBundleDevelopmentRegion</key><string>zh_CN</string><key>CFBundleDisplayName</key><string>一划清</string><key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string><key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string><key>CFBundleInfoDictionaryVersion</key><string>6.0</string><key>CFBundleName</key><string>$(PRODUCT_NAME)</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>CFBundleVersion</key><string>1</string><key>LSRequiresIPhoneOS</key><true/><key>NSPhotoLibraryUsageDescription</key><string>需要访问相册以进行滑卡清理照片</string><key>NSPhotoLibraryAddUsageDescription</key><string>需要访问相册以管理照片</string><key>UILaunchScreen</key><dict/><key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array><key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array></dict></plist>\",encoding=\"utf-8\")' && xcodebuild clean build -project SwipePhotoCleaner.xcodeproj -scheme SwipePhotoCleaner -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO && mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/SwipePhotoCleaner.app Payload/ && zip -r SwipePhotoCleaner.ipa Payload"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "SwipePhotoCleaner-IPA",
            "path": "SwipePhotoCleaner.ipa"
          }
        }
      ]
    }
  }
}
