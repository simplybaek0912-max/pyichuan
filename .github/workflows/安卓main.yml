{
  "name": "Build Android APK",
  "on": ["push", "workflow_dispatch"],
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Generate & Build Android APK",
          "run": "python3 -c 'import pathlib\npathlib.Path(\"src/com/selfuse/swipephotocleaner\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"res/values\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"build\").mkdir(parents=True, exist_ok=True)\npathlib.Path(\"res/values/strings.xml\").write_text(\"\"\"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">一划清</string>\n</resources>\"\"\", encoding=\"utf-8\")\npathlib.Path(\"AndroidManifest.xml\").write_text(\"\"\"<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.selfuse.swipephotocleaner\"\n    android:versionCode=\"1\"\n    android:versionName=\"1.0\">\n    <uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"34\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />\n    <application\n        android:label=\"@string/app_name\"\n        android:theme=\"@android:style/Theme.DeviceDefault.Light.NoActionBar\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:screenOrientation=\"portrait\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\"\"\", encoding=\"utf-8\")\npathlib.Path(\"src/com/selfuse/swipephotocleaner/MainActivity.java\").write_text(\"\"\"package com.selfuse.swipephotocleaner;\n\nimport android.Manifest;\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.app.PendingIntent;\nimport android.content.ContentResolver;\nimport android.content.ContentUris;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.content.pm.PackageManager;\nimport android.database.Cursor;\nimport android.graphics.Bitmap;\nimport android.graphics.BitmapFactory;\nimport android.graphics.Color;\nimport android.graphics.Typeface;\nimport android.graphics.drawable.GradientDrawable;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.provider.MediaStore;\nimport android.util.DisplayMetrics;\nimport android.util.LruCache;\nimport android.util.TypedValue;\nimport android.view.Gravity;\nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\nimport android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.BaseAdapter;\nimport android.widget.Button;\nimport android.widget.FrameLayout;\nimport android.widget.GridView;\nimport android.widget.HorizontalScrollView;\nimport android.widget.ImageView;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport android.widget.Switch;\nimport android.widget.TextView;\n\nimport java.io.InputStream;\nimport java.text.SimpleDateFormat;\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.Date;\nimport java.util.HashSet;\nimport java.util.LinkedHashMap;\nimport java.util.List;\nimport java.util.Locale;\nimport java.util.Map;\nimport java.util.Set;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\npublic class MainActivity extends Activity {\n    static class PhotoItem {\n        long id;\n        Uri uri;\n        long dateMs;\n        long sizeBytes;\n        String bucketId;\n        String bucketName;\n    }\n    static class AlbumInfo {\n        String id;\n        String title;\n        int count;\n        PhotoItem cover;\n    }\n    static class ActionRecord {\n        PhotoItem item;\n        boolean addedToTrash;\n    }\n\n    private SharedPreferences prefs;\n    private Set<String> organizedIds = new HashSet<>();\n    private Set<String> favIds = new HashSet<>();\n    private List<PhotoItem> allPhotos = new ArrayList<>();\n    private List<PhotoItem> displayAssets = new ArrayList<>();\n    private List<PhotoItem> trashAssets = new ArrayList<>();\n    private List<ActionRecord> actionHistory = new ArrayList<>();\n    private List<AlbumInfo> albums = new ArrayList<>();\n    private AlbumInfo selectedAlbum = null;\n\n    private int currentIndex = 0;\n    private int sortOrder = 0; // 0: desc, 1: asc, 2: random\n    private boolean onlyUnorganized = true;\n    private boolean isDarkMode = false;\n\n    private FrameLayout rootContainer;\n    private TextView dateTitleView;\n    private TextView timeSubView;\n    private HorizontalScrollView filmstripScroll;\n    private LinearLayout filmstripTrack;\n    private FrameLayout cardWrapper;\n    private ImageView mainImageView;\n    private View deleteHintPill;\n    private TextView trashBtnText;\n    private TextView favBtnText;\n    private TextView undoBtnText;\n    private TextView toastPill;\n\n    private float downX, downY;\n    private float zoomScale = 1.0f;\n    private boolean isZooming = false;\n    private ScaleGestureDetector scaleDetector;\n    private String currentLoadingUri = \"\";\n\n    private final ExecutorService executor = Executors.newFixedThreadPool(4);\n    private final Handler mainHandler = new Handler(Looper.getMainLooper());\n    private LruCache<String, Bitmap> thumbCache;\n\n    private final SimpleDateFormat dateFmt = new SimpleDateFormat(\"yyyy年M月d日\", Locale.CHINA);\n    private final SimpleDateFormat timeFmt = new SimpleDateFormat(\"HH:mm\", Locale.CHINA);\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        prefs = getSharedPreferences(\"swipe_cleaner_prefs\", MODE_PRIVATE);\n        organizedIds = new HashSet<>(prefs.getStringSet(\"organized_ids\", new HashSet<String>()));\n        favIds = new HashSet<>(prefs.getStringSet(\"fav_ids\", new HashSet<String>()));\n        sortOrder = prefs.getInt(\"sort_order\", 0);\n        onlyUnorganized = prefs.getBoolean(\"only_unorganized\", true);\n        isDarkMode = prefs.getBoolean(\"dark_mode\", false);\n\n        int maxMem = (int) (Runtime.getRuntime().maxMemory() / 1024);\n        thumbCache = new LruCache<String, Bitmap>(maxMem / 8) {\n            @Override\n            protected int sizeOf(String key, Bitmap bmp) {\n                return bmp.getByteCount() / 1024;\n            }\n        };\n\n        scaleDetector = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {\n            @Override\n            public boolean onScaleBegin(ScaleGestureDetector detector) {\n                isZooming = true;\n                return true;\n            }\n            @Override\n            public boolean onScale(ScaleGestureDetector detector) {\n                zoomScale = Math.max(1.0f, Math.min(4.0f, zoomScale * detector.getScaleFactor()));\n                if (mainImageView != null) {\n                    mainImageView.setScaleX(zoomScale);\n                    mainImageView.setScaleY(zoomScale);\n                }\n                return true;\n            }\n            @Override\n            public void onScaleEnd(ScaleGestureDetector detector) {\n                zoomScale = 1.0f;\n                if (mainImageView != null) {\n                    mainImageView.animate().scaleX(1.0f).scaleY(1.0f).setDuration(180).start();\n                }\n                mainHandler.postDelayed(() -> isZooming = false, 180);\n            }\n        });\n\n        rootContainer = new FrameLayout(this);\n        setContentView(rootContainer);\n        checkPermAndLoad();\n    }\n\n    private int dp(int v) {\n        return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());\n    }\n\n    private GradientDrawable roundRect(int fillColor, int radiusDp, int strokeColor, int strokeWidthDp) {\n        GradientDrawable gd = new GradientDrawable();\n        gd.setColor(fillColor);\n        gd.setCornerRadius(dp(radiusDp));\n        if (strokeWidthDp > 0) gd.setStroke(dp(strokeWidthDp), strokeColor);\n        return gd;\n    }\n\n    private void checkPermAndLoad() {\n        String perm = Build.VERSION.SDK_INT >= 33 ? \"android.permission.READ_MEDIA_IMAGES\" : Manifest.permission.READ_EXTERNAL_STORAGE;\n        if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(perm) != PackageManager.PERMISSION_GRANTED) {\n            requestPermissions(new String[]{perm}, 1001);\n        } else {\n            loadLibraryAsync();\n        }\n    }\n\n    @Override\n    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {\n        if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {\n            loadLibraryAsync();\n        } else {\n            showPermissionGuide();\n        }\n    }\n\n    private void showPermissionGuide() {\n        rootContainer.removeAllViews();\n        int bg = isDarkMode ? 0xFF121214 : 0xFFF2F2F7;\n        int fg = isDarkMode ? 0xFFFFFFFF : 0xFF1C1C1E;\n        rootContainer.setBackgroundColor(bg);\n        LinearLayout box = new LinearLayout(this);\n        box.setOrientation(LinearLayout.VERTICAL);\n        box.setGravity(Gravity.CENTER);\n        box.setPadding(dp(32), dp(32), dp(32), dp(32));\n        TextView tv = new TextView(this);\n        tv.setText(\"需要访问相册权限以进行滑卡清理照片\");\n        tv.setTextColor(fg);\n        tv.setTextSize(16);\n        tv.setGravity(Gravity.CENTER);\n        Button btn = new Button(this);\n        btn.setText(\"重新授权\");\n        btn.setOnClickListener(v -> checkPermAndLoad());\n        box.addView(tv);\n        box.addView(btn);\n        rootContainer.addView(box, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n    }\n\n    private void loadLibraryAsync() {\n        rootContainer.removeAllViews();\n        int bg = isDarkMode ? 0xFF121214 : 0xFFF2F2F7;\n        rootContainer.setBackgroundColor(bg);\n        ProgressBar pb = new ProgressBar(this);\n        FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(dp(48), dp(48), Gravity.CENTER);\n        rootContainer.addView(pb, lp);\n\n        executor.execute(() -> {\n            List<PhotoItem> list = new ArrayList<>();\n            Map<String, AlbumInfo> bucketMap = new LinkedHashMap<>();\n            AlbumInfo screenshotAlbum = new AlbumInfo();\n            screenshotAlbum.id = \"SCREENSHOTS\";\n            screenshotAlbum.title = \"截屏\";\n\n            String[] proj = new String[]{\n                MediaStore.Images.Media._ID,\n                MediaStore.Images.Media.DATE_ADDED,\n                MediaStore.Images.Media.DATE_TAKEN,\n                MediaStore.Images.Media.SIZE,\n                MediaStore.Images.Media.BUCKET_ID,\n                MediaStore.Images.Media.BUCKET_DISPLAY_NAME\n            };\n            try (Cursor c = getContentResolver().query(\n                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI,\n                    proj, null, null, MediaStore.Images.Media.DATE_ADDED + \" DESC\")) {\n                if (c != null) {\n                    int idCol = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID);\n                    int addCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED);\n                    int takeCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_TAKEN);\n                    int sizeCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE);\n                    int bIdCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.BUCKET_ID);\n                    int bNameCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.BUCKET_DISPLAY_NAME);\n\n                    while (c.moveToNext()) {\n                        long id = c.getLong(idCol);\n                        long taken = c.getLong(takeCol);\n                        long added = c.getLong(addCol) * 1000L;\n                        PhotoItem item = new PhotoItem();\n                        item.id = id;\n                        item.uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);\n                        item.dateMs = taken > 0 ? taken : added;\n                        item.sizeBytes = Math.max(0, c.getLong(sizeCol));\n                        item.bucketId = c.getString(bIdCol) != null ? c.getString(bIdCol) : \"OTHER\";\n                        item.bucketName = c.getString(bNameCol) != null ? c.getString(bNameCol) : \"其他相册\";\n                        list.add(item);\n\n                        String lower = item.bucketName.toLowerCase(Locale.ROOT);\n                        if (lower.contains(\"screenshot\") || lower.contains(\"截屏\") || lower.contains(\"截图\")) {\n                            screenshotAlbum.count++;\n                            if (screenshotAlbum.cover == null) screenshotAlbum.cover = item;\n                        }\n\n                        AlbumInfo alb = bucketMap.get(item.bucketId);\n                        if (alb == null) {\n                            alb = new AlbumInfo();\n                            alb.id = item.bucketId;\n                            alb.title = item.bucketName;\n                            alb.cover = item;\n                            bucketMap.put(item.bucketId, alb);\n                        }\n                        alb.count++;\n                    }\n                }\n            } catch (Exception ignored) {}\n\n            List<AlbumInfo> builtAlbums = new ArrayList<>();\n            AlbumInfo allAlb = new AlbumInfo();\n            allAlb.id = \"ALL_PHOTOS\";\n            allAlb.title = \"全部相册\";\n            allAlb.count = list.size();\n            allAlb.cover = list.isEmpty() ? null : list.get(0);\n            builtAlbums.add(allAlb);\n            if (screenshotAlbum.count > 0) builtAlbums.add(screenshotAlbum);\n            builtAlbums.addAll(bucketMap.values());\n\n            mainHandler.post(() -> {\n                allPhotos = list;\n                albums = builtAlbums;\n                if (selectedAlbum == null && !albums.isEmpty()) selectedAlbum = albums.get(0);\n                applyFilterAndSort();\n                buildMainUI();\n            });\n        });\n    }\n\n    private void applyFilterAndSort() {\n        Set<String> trashSet = new HashSet<>();\n        for (PhotoItem t : trashAssets) trashSet.add(t.uri.toString());\n\n        List<PhotoItem> filtered = new ArrayList<>();\n        String albId = selectedAlbum != null ? selectedAlbum.id : \"ALL_PHOTOS\";\n        for (PhotoItem p : allPhotos) {\n            String key = p.uri.toString();\n            if (trashSet.contains(key)) continue;\n            if (onlyUnorganized && organizedIds.contains(key)) continue;\n            if (\"SCREENSHOTS\".equals(albId)) {\n                String lower = p.bucketName.toLowerCase(Locale.ROOT);\n                if (!lower.contains(\"screenshot\") && !lower.contains(\"截屏\") && !lower.contains(\"截图\")) continue;\n            } else if (!\"ALL_PHOTOS\".equals(albId) && !albId.equals(p.bucketId)) {\n                continue;\n            }\n            filtered.add(p);\n        }\n        if (sortOrder == 1) {\n            Collections.reverse(filtered);\n        } else if (sortOrder == 2) {\n            Collections.shuffle(filtered);\n        }\n        displayAssets = filtered;\n        if (currentIndex >= displayAssets.size()) {\n            currentIndex = Math.max(0, displayAssets.size() - 1);\n        }\n    }\n\n    private void saveOrganized() {\n        prefs.edit().putStringSet(\"organized_ids\", new HashSet<>(organizedIds)).apply();\n    }\n\n    private void buildMainUI() {\n        rootContainer.removeAllViews();\n        int bg = isDarkMode ? 0xFF000000 : 0xFFF2F2F7;\n        int cardBg = isDarkMode ? 0xFF1C1C1E : 0xFFFFFFFF;\n        int fg = isDarkMode ? 0xFFFFFFFF : 0xFF1C1C1E;\n        int subFg = isDarkMode ? 0xFF8E8E93 : 0xFF6C6C70;\n        rootContainer.setBackgroundColor(bg);\n\n        LinearLayout mainCol = new LinearLayout(this);\n        mainCol.setOrientation(LinearLayout.VERTICAL);\n        mainCol.setPadding(dp(16), dp(14), dp(16), dp(14));\n\n        // 1. 顶部栏\n        LinearLayout topBar = new LinearLayout(this);\n        topBar.setOrientation(LinearLayout.HORIZONTAL);\n        topBar.setGravity(Gravity.CENTER_VERTICAL);\n\n        TextView gearBtn = makeCircleBtn(\"⚙️\", cardBg, fg, v -> showSettingsDialog());\n        topBar.addView(gearBtn);\n\n        LinearLayout titleBox = new LinearLayout(this);\n        titleBox.setOrientation(LinearLayout.VERTICAL);\n        titleBox.setGravity(Gravity.CENTER);\n        dateTitleView = new TextView(this);\n        dateTitleView.setTextSize(16);\n        dateTitleView.setTypeface(Typeface.DEFAULT_BOLD);\n        dateTitleView.setTextColor(fg);\n        dateTitleView.setGravity(Gravity.CENTER);\n        timeSubView = new TextView(this);\n        timeSubView.setTextSize(12);\n        timeSubView.setTextColor(subFg);\n        timeSubView.setGravity(Gravity.CENTER);\n        titleBox.addView(dateTitleView);\n        titleBox.addView(timeSubView);\n        topBar.addView(titleBox, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));\n\n        TextView shareBtn = makeCircleBtn(\"📤\", cardBg, fg, v -> shareCurrent());\n        LinearLayout.LayoutParams sLp = new LinearLayout.LayoutParams(dp(40), dp(40));\n        sLp.rightMargin = dp(8);\n        topBar.addView(shareBtn, sLp);\n\n        TextView folderBtn = makeCircleBtn(\"📁\", cardBg, fg, v -> showAlbumPickerDialog());\n        topBar.addView(folderBtn);\n        mainCol.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));\n\n        // 2. 缩略图胶片条\n        filmstripScroll = new HorizontalScrollView(this);\n        filmstripScroll.setHorizontalScrollBarEnabled(false);\n        filmstripTrack = new LinearLayout(this);\n        filmstripTrack.setOrientation(LinearLayout.HORIZONTAL);\n        filmstripScroll.addView(filmstripTrack);\n        LinearLayout.LayoutParams stripLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(62));\n        stripLp.topMargin = dp(10);\n        stripLp.bottomMargin = dp(10);\n        mainCol.addView(filmstripScroll, stripLp);\n\n        // 3. 中间主卡片\n        FrameLayout centerArea = new FrameLayout(this);\n        cardWrapper = new FrameLayout(this);\n        cardWrapper.setBackground(roundRect(cardBg, 24, 0, 0));\n        cardWrapper.setPadding(dp(10), dp(10), dp(10), dp(10));\n\n        mainImageView = new ImageView(this);\n        mainImageView.setScaleType(ImageView.ScaleType.FIT_CENTER);\n        cardWrapper.addView(mainImageView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n\n        TextView delPill = new TextView(this);\n        delPill.setText(\"🗑 松开移入待删除\");\n        delPill.setTextColor(Color.WHITE);\n        delPill.setTextSize(13);\n        delPill.setTypeface(Typeface.DEFAULT_BOLD);\n        delPill.setPadding(dp(16), dp(8), dp(16), dp(8));\n        delPill.setBackground(roundRect(0xE6FF3B30, 20, 0, 0));\n        delPill.setVisibility(View.GONE);\n        FrameLayout.LayoutParams pillLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP | Gravity.CENTER_HORIZONTAL);\n        pillLp.topMargin = dp(16);\n        cardWrapper.addView(delPill, pillLp);\n        deleteHintPill = delPill;\n\n        setupCardTouch();\n        centerArea.addView(cardWrapper, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n        mainCol.addView(centerArea, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));\n\n        // 4. 底部操作栏\n        LinearLayout bottomBar = new LinearLayout(this);\n        bottomBar.setOrientation(LinearLayout.HORIZONTAL);\n        bottomBar.setGravity(Gravity.CENTER_VERTICAL);\n        LinearLayout.LayoutParams botLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56));\n        botLp.topMargin = dp(12);\n\n        LinearLayout leftCapsule = new LinearLayout(this);\n        leftCapsule.setOrientation(LinearLayout.HORIZONTAL);\n        leftCapsule.setBackground(roundRect(cardBg, 16, isDarkMode ? 0x22FFFFFF : 0x15000000, 1));\n        leftCapsule.setGravity(Gravity.CENTER_VERTICAL);\n\n        trashBtnText = new TextView(this);\n        trashBtnText.setGravity(Gravity.CENTER);\n        trashBtnText.setTextSize(15);\n        trashBtnText.setTypeface(Typeface.DEFAULT_BOLD);\n        trashBtnText.setTextColor(fg);\n        trashBtnText.setOnClickListener(v -> commitBatchDelete(null));\n        leftCapsule.addView(trashBtnText, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f));\n\n        View div = new View(this);\n        div.setBackgroundColor(isDarkMode ? 0x33FFFFFF : 0x22000000);\n        leftCapsule.addView(div, new LinearLayout.LayoutParams(dp(1), dp(22)));\n\n        TextView eyeBtn = new TextView(this);\n        eyeBtn.setText(\"👁\");\n        eyeBtn.setGravity(Gravity.CENTER);\n        eyeBtn.setTextSize(17);\n        eyeBtn.setOnClickListener(v -> showTrashDialog());\n        leftCapsule.addView(eyeBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f));\n        bottomBar.addView(leftCapsule, new LinearLayout.LayoutParams(0, dp(54), 1f));\n\n        favBtnText = new TextView(this);\n        favBtnText.setGravity(Gravity.CENTER);\n        favBtnText.setTextSize(22);\n        favBtnText.setOnClickListener(v -> toggleFavorite());\n        LinearLayout.LayoutParams favLp = new LinearLayout.LayoutParams(dp(56), dp(54));\n        favLp.leftMargin = dp(10);\n        favLp.rightMargin = dp(10);\n        bottomBar.addView(favBtnText, favLp);\n\n        undoBtnText = new TextView(this);\n        undoBtnText.setText(\"↩\");\n        undoBtnText.setGravity(Gravity.CENTER);\n        undoBtnText.setTextSize(20);\n        undoBtnText.setTypeface(Typeface.DEFAULT_BOLD);\n        undoBtnText.setTextColor(fg);\n        undoBtnText.setBackground(roundRect(cardBg, 16, isDarkMode ? 0x22FFFFFF : 0x15000000, 1));\n        undoBtnText.setOnClickListener(v -> undoLastAction());\n        bottomBar.addView(undoBtnText, new LinearLayout.LayoutParams(0, dp(54), 1f));\n\n        mainCol.addView(bottomBar, botLp);\n        rootContainer.addView(mainCol, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n\n        toastPill = new TextView(this);\n        toastPill.setTextColor(Color.WHITE);\n        toastPill.setTextSize(14);\n        toastPill.setTypeface(Typeface.DEFAULT_BOLD);\n        toastPill.setPadding(dp(22), dp(11), dp(22), dp(11));\n        toastPill.setBackground(roundRect(0xD9000000, 24, 0, 0));\n        toastPill.setVisibility(View.GONE);\n        FrameLayout.LayoutParams tLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);\n        tLp.bottomMargin = dp(86);\n        rootContainer.addView(toastPill, tLp);\n\n        refreshAllViews();\n    }\n\n    private TextView makeCircleBtn(String icon, int bg, int fg, View.OnClickListener listener) {\n        TextView tv = new TextView(this);\n        tv.setText(icon);\n        tv.setTextSize(16);\n        tv.setTextColor(fg);\n        tv.setGravity(Gravity.CENTER);\n        tv.setBackground(roundRect(bg, 21, 0, 0));\n        tv.setLayoutParams(new LinearLayout.LayoutParams(dp(42), dp(42)));\n        tv.setOnClickListener(listener);\n        return tv;\n    }\n\n    private void setupCardTouch() {\n        cardWrapper.setOnTouchListener((v, ev) -> {\n            scaleDetector.onTouchEvent(ev);\n            if (isZooming || ev.getPointerCount() > 1) {\n                deleteHintPill.setVisibility(View.GONE);\n                return true;\n            }\n            switch (ev.getActionMasked()) {\n                case MotionEvent.ACTION_DOWN:\n                    downX = ev.getRawX();\n                    downY = ev.getRawY();\n                    break;\n                case MotionEvent.ACTION_MOVE:\n                    float dx = ev.getRawX() - downX;\n                    float dy = ev.getRawY() - downY;\n                    cardWrapper.setTranslationX(dx * 0.45f);\n                    cardWrapper.setTranslationY(dy);\n                    cardWrapper.setRotation(dx / 28f);\n                    deleteHintPill.setVisibility(dy < -dp(35) ? View.VISIBLE : View.GONE);\n                    break;\n                case MotionEvent.ACTION_UP:\n                case MotionEvent.ACTION_CANCEL:\n                    float totalDx = ev.getRawX() - downX;\n                    float totalDy = ev.getRawY() - downY;\n                    deleteHintPill.setVisibility(View.GONE);\n                    cardWrapper.animate().translationX(0f).translationY(0f).rotation(0f).setDuration(160).start();\n                    if (totalDy < -dp(80)) {\n                        swipeUpDelete();\n                    } else if (Math.abs(totalDx) > dp(70) || totalDy > dp(85)) {\n                        swipeKeep();\n                    }\n                    break;\n            }\n            return true;\n        });\n    }\n\n    private PhotoItem getCurrentItem() {\n        if (currentIndex >= 0 && currentIndex < displayAssets.size()) return displayAssets.get(currentIndex);\n        return null;\n    }\n\n    private void refreshAllViews() {\n        PhotoItem cur = getCurrentItem();\n        int fg = isDarkMode ? 0xFFFFFFFF : 0xFF1C1C1E;\n        int subFg = isDarkMode ? 0xFF8E8E93 : 0xFF8E8E93;\n\n        if (cur != null) {\n            Date d = new Date(cur.dateMs);\n            dateTitleView.setText(dateFmt.format(d));\n            timeSubView.setText(timeFmt.format(d));\n            timeSubView.setVisibility(View.VISIBLE);\n            boolean isFav = favIds.contains(cur.uri.toString());\n            favBtnText.setText(isFav ? \"❤️\" : \"🤍\");\n            loadMainImage(cur);\n        } else {\n            dateTitleView.setText(selectedAlbum != null ? selectedAlbum.title : \"全部相册\");\n            timeSubView.setText(\"当前相册已整理完毕\");\n            mainImageView.setImageBitmap(null);\n            favBtnText.setText(\"🤍\");\n        }\n\n        trashBtnText.setText(trashAssets.isEmpty() ? \"🗑\" : \"🗑 (\" + trashAssets.size() + \")\");\n        trashBtnText.setTextColor(trashAssets.isEmpty() ? subFg : fg);\n        undoBtnText.setTextColor(actionHistory.isEmpty() ? subFg : fg);\n        rebuildFilmstrip();\n    }\n\n    private void rebuildFilmstrip() {\n        filmstripTrack.removeAllViews();\n        if (displayAssets.isEmpty()) return;\n        int start = Math.max(0, currentIndex - 25);\n        int end = Math.min(displayAssets.size() - 1, currentIndex + 25);\n        int borderCol = isDarkMode ? Color.WHITE : Color.BLACK;\n        View selectedThumbView = null;\n\n        for (int i = start; i <= end; i++) {\n            final int idx = i;\n            PhotoItem item = displayAssets.get(i);\n            FrameLayout cell = new FrameLayout(this);\n            LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(56));\n            lp.rightMargin = dp(6);\n            cell.setLayoutParams(lp);\n\n            ImageView iv = new ImageView(this);\n            iv.setScaleType(ImageView.ScaleType.CENTER_CROP);\n            iv.setBackgroundColor(isDarkMode ? 0xFF2C2C2E : 0xFFE5E5EA);\n            cell.addView(iv, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n\n            if (i == currentIndex) {\n                View border = new View(this);\n                border.setBackground(roundRect(Color.TRANSPARENT, 6, borderCol, 2));\n                cell.addView(border, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));\n                cell.setAlpha(1.0f);\n                selectedThumbView = cell;\n            } else {\n                cell.setAlpha(0.55f);\n            }\n\n            cell.setOnClickListener(v -> {\n                currentIndex = idx;\n                refreshAllViews();\n            });\n            loadThumbInto(item, iv, dp(90), dp(112));\n            filmstripTrack.addView(cell);\n        }\n\n        if (selectedThumbView != null) {\n            final View targetV = selectedThumbView;\n            filmstripScroll.post(() -> {\n                int scrollX = targetV.getLeft() - (filmstripScroll.getWidth() / 2) + (targetV.getWidth() / 2);\n                filmstripScroll.smoothScrollTo(Math.max(0, scrollX), 0);\n            });\n        }\n    }\n\n    private void loadThumbInto(PhotoItem item, ImageView iv, int reqW, int reqH) {\n        final String key = item.uri.toString();\n        iv.setTag(key);\n        Bitmap cached = thumbCache.get(key);\n        if (cached != null) {\n            iv.setImageBitmap(cached);\n            return;\n        }\n        executor.execute(() -> {\n            Bitmap bmp = decodeSampled(item.uri, reqW, reqH);\n            if (bmp != null) {\n                thumbCache.put(key, bmp);\n                mainHandler.post(() -> {\n                    if (key.equals(iv.getTag())) iv.setImageBitmap(bmp);\n                });\n            }\n        });\n    }\n\n    private void loadMainImage(PhotoItem item) {\n        final String key = item.uri.toString();\n        currentLoadingUri = key;\n        Bitmap cached = thumbCache.get(key);\n        if (cached != null) mainImageView.setImageBitmap(cached);\n        DisplayMetrics dm = getResources().getDisplayMetrics();\n        final int reqW = Math.max(1080, dm.widthPixels);\n        final int reqH = Math.max(1440, dm.heightPixels);\n        executor.execute(() -> {\n            Bitmap full = decodeSampled(item.uri, reqW, reqH);\n            if (full != null) {\n                mainHandler.post(() -> {\n                    if (key.equals(currentLoadingUri)) {\n                        mainImageView.setScaleX(1.0f);\n                        mainImageView.setScaleY(1.0f);\n                        mainImageView.setImageBitmap(full);\n                    }\n                });\n            }\n        });\n    }\n\n    private Bitmap decodeSampled(Uri uri, int reqW, int reqH) {\n        try {\n            ContentResolver cr = getContentResolver();\n            BitmapFactory.Options opts = new BitmapFactory.Options();\n            opts.inJustDecodeBounds = true;\n            try (InputStream is = cr.openInputStream(uri)) {\n                BitmapFactory.decodeStream(is, null, opts);\n            }\n            int inSample = 1;\n            while ((opts.outWidth / inSample) > reqW * 2 || (opts.outHeight / inSample) > reqH * 2) {\n                inSample *= 2;\n            }\n            BitmapFactory.Options decOpts = new BitmapFactory.Options();\n            decOpts.inSampleSize = Math.max(1, inSample);\n            try (InputStream is2 = cr.openInputStream(uri)) {\n                return BitmapFactory.decodeStream(is2, null, decOpts);\n            }\n        } catch (Exception e) {\n            return null;\n        }\n    }\n\n    private void swipeUpDelete() {\n        PhotoItem cur = getCurrentItem();\n        if (cur == null) return;\n        String key = cur.uri.toString();\n        boolean exists = false;\n        for (PhotoItem t : trashAssets) {\n            if (t.uri.toString().equals(key)) { exists = true; break; }\n        }\n        if (!exists) trashAssets.add(cur);\n        organizedIds.add(key);\n        saveOrganized();\n\n        ActionRecord rec = new ActionRecord();\n        rec.item = cur;\n        rec.addedToTrash = true;\n        actionHistory.add(rec);\n\n        displayAssets.remove(currentIndex);\n        if (currentIndex >= displayAssets.size()) currentIndex = Math.max(0, displayAssets.size() - 1);\n        refreshAllViews();\n    }\n\n    private void swipeKeep() {\n        PhotoItem cur = getCurrentItem();\n        if (cur == null) return;\n        String key = cur.uri.toString();\n        organizedIds.add(key);\n        saveOrganized();\n\n        ActionRecord rec = new ActionRecord();\n        rec.item = cur;\n        rec.addedToTrash = false;\n        actionHistory.add(rec);\n\n        if (onlyUnorganized) {\n            displayAssets.remove(currentIndex);\n            if (currentIndex >= displayAssets.size()) currentIndex = Math.max(0, displayAssets.size() - 1);\n        } else if (currentIndex < displayAssets.size() - 1) {\n            currentIndex++;\n        }\n        refreshAllViews();\n    }\n\n    private void undoLastAction() {\n        if (actionHistory.isEmpty()) return;\n        ActionRecord last = actionHistory.remove(actionHistory.size() - 1);\n        String key = last.item.uri.toString();\n        organizedIds.remove(key);\n        saveOrganized();\n        if (last.addedToTrash) {\n            for (int i = trashAssets.size() - 1; i >= 0; i--) {\n                if (trashAssets.get(i).uri.toString().equals(key)) trashAssets.remove(i);\n            }\n        }\n        boolean inDisplay = false;\n        for (int i = 0; i < displayAssets.size(); i++) {\n            if (displayAssets.get(i).uri.toString().equals(key)) {\n                currentIndex = i;\n                inDisplay = true;\n                break;\n            }\n        }\n        if (!inDisplay) {\n            int pos = Math.min(currentIndex, displayAssets.size());\n            displayAssets.add(pos, last.item);\n            currentIndex = pos;\n        }\n        refreshAllViews();\n    }\n\n    private void toggleFavorite() {\n        PhotoItem cur = getCurrentItem();\n        if (cur == null) return;\n        String key = cur.uri.toString();\n        if (favIds.contains(key)) favIds.remove(key);\n        else favIds.add(key);\n        prefs.edit().putStringSet(\"fav_ids\", new HashSet<>(favIds)).apply();\n        refreshAllViews();\n    }\n\n    private void shareCurrent() {\n        PhotoItem cur = getCurrentItem();\n        if (cur == null) return;\n        Intent send = new Intent(Intent.ACTION_SEND);\n        send.setType(\"image/*\");\n        send.putExtra(Intent.EXTRA_STREAM, cur.uri);\n        send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n        startActivity(Intent.createChooser(send, \"分享图片\"));\n    }\n\n    private long pendingDeleteBytes = 0;\n    private int pendingDeleteCount = 0;\n    private Runnable pendingAfterDelete = null;\n\n    private void commitBatchDelete(Runnable onComplete) {\n        if (trashAssets.isEmpty()) return;\n        long bytes = 0;\n        List<Uri> uris = new ArrayList<>();\n        for (PhotoItem t : trashAssets) {\n            bytes += t.sizeBytes;\n            uris.add(t.uri);\n        }\n        pendingDeleteBytes = bytes;\n        pendingDeleteCount = trashAssets.size();\n        pendingAfterDelete = onComplete;\n\n        if (Build.VERSION.SDK_INT >= 30) {\n            try {\n                PendingIntent pi = MediaStore.createDeleteRequest(getContentResolver(), uris);\n                startIntentSenderForResult(pi.getIntentSender(), 2001, null, 0, 0, 0);\n                return;\n            } catch (Exception ignored) {}\n        }\n        for (Uri u : uris) {\n            try { getContentResolver().delete(u, null, null); } catch (Exception ignored) {}\n        }\n        onBatchDeleteSuccess();\n    }\n\n    @Override\n    protected void onActivityResult(int requestCode, int resultCode, Intent data) {\n        if (requestCode == 2001 && resultCode == RESULT_OK) {\n            onBatchDeleteSuccess();\n        }\n    }\n\n    private void onBatchDeleteSuccess() {\n        Set<String> delSet = new HashSet<>();\n        for (PhotoItem t : trashAssets) delSet.add(t.uri.toString());\n        for (int i = allPhotos.size() - 1; i >= 0; i--) {\n            if (delSet.contains(allPhotos.get(i).uri.toString())) allPhotos.remove(i);\n        }\n        for (int i = actionHistory.size() - 1; i >= 0; i--) {\n            if (delSet.contains(actionHistory.get(i).item.uri.toString())) actionHistory.remove(i);\n        }\n        trashAssets.clear();\n        if (pendingAfterDelete != null) pendingAfterDelete.run();\n        refreshAllViews();\n        double mb = pendingDeleteBytes / (1024.0 * 1024.0);\n        showToast(mb >= 0.1 ? String.format(Locale.CHINA, \"已清除 %.1f MB\", mb) : \"已清理 \" + pendingDeleteCount + \" 张照片\");\n    }\n\n    private void showToast(String msg) {\n        if (toastPill == null) return;\n        toastPill.setText(msg);\n        toastPill.setVisibility(View.VISIBLE);\n        mainHandler.removeCallbacksAndMessages(\"TOAST\");\n        mainHandler.postDelayed(() -> toastPill.setVisibility(View.GONE), 2200);\n    }\n\n    private void showTrashDialog() {\n        AlertDialog.Builder b = new AlertDialog.Builder(this);\n        b.setTitle(\"待删除 (\" + trashAssets.size() + \"张) · 点击图片恢复\");\n        if (trashAssets.isEmpty()) {\n            b.setMessage(\"待删除列表为空\");\n            b.setPositiveButton(\"关闭\", null);\n            b.show();\n            return;\n        }\n        GridView gv = new GridView(this);\n        gv.setNumColumns(3);\n        gv.setVerticalSpacing(dp(4));\n        gv.setHorizontalSpacing(dp(4));\n        gv.setPadding(dp(12), dp(12), dp(12), dp(12));\n        final AlertDialog[] dlgRef = new AlertDialog[1];\n        BaseAdapter adapter = new BaseAdapter() {\n            @Override public int getCount() { return trashAssets.size(); }\n            @Override public Object getItem(int pos) { return trashAssets.get(pos); }\n            @Override public long getItemId(int pos) { return pos; }\n            @Override public View getView(int pos, View convertView, ViewGroup parent) {\n                ImageView iv = new ImageView(MainActivity.this);\n                iv.setLayoutParams(new GridView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(115)));\n                iv.setScaleType(ImageView.ScaleType.CENTER_CROP);\n                PhotoItem item = trashAssets.get(pos);\n                loadThumbInto(item, iv, dp(120), dp(120));\n                iv.setOnClickListener(v -> {\n                    trashAssets.remove(pos);\n                    organizedIds.remove(item.uri.toString());\n                    saveOrganized();\n                    int ins = Math.min(currentIndex, displayAssets.size());\n                    displayAssets.add(ins, item);\n                    currentIndex = ins;\n                    refreshAllViews();\n                    notifyDataSetChanged();\n                    if (trashAssets.isEmpty() && dlgRef[0] != null) dlgRef[0].dismiss();\n                });\n                return iv;\n            }\n        };\n        gv.setAdapter(adapter);\n        b.setView(gv);\n        b.setPositiveButton(\"一键清空删除 (\" + trashAssets.size() + \")\", (d, w) -> commitBatchDelete(null));\n        b.setNegativeButton(\"返回\", null);\n        dlgRef[0] = b.show();\n    }\n\n    private void showSettingsDialog() {\n        LinearLayout box = new LinearLayout(this);\n        box.setOrientation(LinearLayout.VERTICAL);\n        box.setPadding(dp(20), dp(16), dp(20), dp(8));\n\n        String[] sortLabels = new String[]{\"浏览排序：逆序（最新在前）\", \"浏览排序：顺序（最早在前）\", \"浏览排序：随机乱序\"};\n        Button sortBtn = new Button(this);\n        sortBtn.setText(sortLabels[sortOrder]);\n        sortBtn.setOnClickListener(v -> {\n            sortOrder = (sortOrder + 1) % 3;\n            prefs.edit().putInt(\"sort_order\", sortOrder).apply();\n            sortBtn.setText(sortLabels[sortOrder]);\n            applyFilterAndSort();\n            refreshAllViews();\n        });\n        box.addView(sortBtn);\n\n        Switch unorgSw = new Switch(this);\n        int unorgCount = Math.max(0, allPhotos.size() - organizedIds.size());\n        unorgSw.setText(\"仅看未整理的图片（剩余 \" + unorgCount + \" 张）\");\n        unorgSw.setChecked(onlyUnorganized);\n        unorgSw.setPadding(0, dp(14), 0, dp(14));\n        unorgSw.setOnCheckedChangeListener((btn, checked) -> {\n            onlyUnorganized = checked;\n            prefs.edit().putBoolean(\"only_unorganized\", checked).apply();\n            applyFilterAndSort();\n            refreshAllViews();\n        });\n        box.addView(unorgSw);\n\n        Switch darkSw = new Switch(this);\n        darkSw.setText(\"深色模式 (夜间护眼)\");\n        darkSw.setChecked(isDarkMode);\n        darkSw.setPadding(0, dp(8), 0, dp(14));\n        darkSw.setOnCheckedChangeListener((btn, checked) -> {\n            isDarkMode = checked;\n            prefs.edit().putBoolean(\"dark_mode\", checked).apply();\n            buildMainUI();\n        });\n        box.addView(darkSw);\n\n        new AlertDialog.Builder(this)\n            .setTitle(\"设置\")\n            .setView(box)\n            .setNeutralButton(\"重置已整理记录\", (d, w) -> {\n                organizedIds.clear();\n                saveOrganized();\n                applyFilterAndSort();\n                refreshAllViews();\n            })\n            .setPositiveButton(\"完成\", null)\n            .show();\n    }\n\n    private void showAlbumPickerDialog() {\n        String[] items = new String[albums.size()];\n        for (int i = 0; i < albums.size(); i++) {\n            AlbumInfo a = albums.get(i);\n            items[i] = a.title + \" (\" + a.count + \")\";\n        }\n        new AlertDialog.Builder(this)\n            .setTitle(\"选择相册\")\n            .setItems(items, (d, which) -> {\n                selectedAlbum = albums.get(which);\n                currentIndex = 0;\n                applyFilterAndSort();\n                re