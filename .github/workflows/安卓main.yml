          "name": "Generate & Build Android APK",
          "run": "python3 -c 'import pathlib; pathlib.Path(\"src/com/selfuse/swipephotocleaner\").mkdir(parents=True,exist_ok=True); pathlib.Path(\"build\").mkdir(parents=True,exist_ok=True); pathlib.Path(\"AndroidManifest.xml\").write_text(\"<?xml version=\\x271.0\\x27 encoding=\\x27utf-8\\x27?><manifest xmlns:android=\\x27http://schemas.android.com/apk/res/android\\x27 package=\\x27com.selfuse.swipephotocleaner\\x27 android:versionCode=\\x271\\x27 android:versionName=\\x271.0\\x27><uses-sdk android:minSdkVersion=\\x2724\\x27 android:targetSdkVersion=\\x2734\\x27/><uses-permission android:name=\\x27android.permission.READ_MEDIA_IMAGES\\x27/><uses-permission android:name=\\x27android.permission.READ_EXTERNAL_STORAGE\\x27 android:maxSdkVersion=\\x2732\\x27/><uses-permission android:name=\\x27android.permission.WRITE_EXTERNAL_STORAGE\\x27 android:maxSdkVersion=\\x2729\\x27/><application android:label=\\x27一划清\\x27 android:theme=\\x27@android:style/Theme.DeviceDefault.Light.NoActionBar\\x27><activity android:name=\\x27.MainActivity\\x27 android:exported=\\x27true\\x27 android:screenOrientation=\\x27portrait\\x27><intent-filter><action android:name=\\x27android.intent.action.MAIN\\x27/><category android:name=\\x27android.intent.category.LAUNCHER\\x27/></intent-filter></activity></application></manifest>\",encoding=\"utf-8\"); pathlib.Path(\"src/com/selfuse/swipephotocleaner/MainActivity.java\").write_text(\"package com.selfuse.swipephotocleaner;\\nimport android.Manifest;\\nimport android.app.Activity;\\nimport android.app.AlertDialog;\\nimport android.app.PendingIntent;\\nimport android.content.ContentResolver;\\nimport android.content.ContentUris;\\nimport android.content.DialogInterface;\\nimport android.content.Intent;\\nimport android.content.SharedPreferences;\\nimport android.content.pm.PackageManager;\\nimport android.database.Cursor;\\nimport android.graphics.Bitmap;\\nimport android.graphics.BitmapFactory;\\nimport android.graphics.Color;\\nimport android.graphics.Typeface;\\nimport android.graphics.drawable.GradientDrawable;\\nimport android.net.Uri;\\nimport android.os.Build;\\nimport android.os.Bundle;\\nimport android.os.Handler;\\nimport android.os.Looper;\\nimport android.provider.MediaStore;\\nimport android.util.DisplayMetrics;\\nimport android.util.LruCache;\\nimport android.util.TypedValue;\\nimport android.view.Gravity;\\nimport android.view.MotionEvent;\\nimport android.view.ScaleGestureDetector;\\nimport android.view.View;\\nimport android.view.ViewGroup;\\nimport android.widget.BaseAdapter;\\nimport android.widget.Button;\\nimport android.widget.CompoundButton;\\nimport android.widget.FrameLayout;\\nimport android.widget.GridView;\\nimport android.widget.HorizontalScrollView;\\nimport android.widget.ImageView;\\nimport android.widget.LinearLayout;\\nimport android.widget.ProgressBar;\\nimport android.widget.Switch;\\nimport android.widget.TextView;\\nimport java.io.InputStream;\\nimport java.text.SimpleDateFormat;\\nimport java.util.ArrayList;\\nimport java.util.Collections;\\nimport java.util.Date;\\nimport java.util.HashSet;\\nimport java.util.LinkedHashMap;\\nimport java.util.List;\\nimport java.util.Locale;\\nimport java.util.Map;\\nimport java.util.Set;\\nimport java.util.concurrent.ExecutorService;\\nimport java.util.concurrent.Executors;\\npublic class MainActivity extends Activity {\\nstatic class PhotoItem { long id; Uri uri; long dateMs; long sizeBytes; String bucketId; String bucketName; }\\nstatic class AlbumInfo { String id; String title; int count; PhotoItem cover; }\\nstatic class ActionRecord { PhotoItem item; boolean addedToTrash; }\\nprivate SharedPreferences prefs;\\nprivate Set<String> organizedIds = new HashSet<String>();\\nprivate Set<String> favIds = new HashSet<String>();\\nprivate List<PhotoItem> allPhotos = new ArrayList<PhotoItem>();\\nprivate List<PhotoItem> displayAssets = new ArrayList<PhotoItem>();\\nprivate List<PhotoItem> trashAssets = new ArrayList<PhotoItem>();\\nprivate List<ActionRecord> actionHistory = new ArrayList<ActionRecord>();\\nprivate List<AlbumInfo> albums = new ArrayList<AlbumInfo>();\\nprivate AlbumInfo selectedAlbum = null;\\nprivate int currentIndex = 0;\\nprivate int sortOrder = 0;\\nprivate boolean onlyUnorganized = true;\\nprivate boolean isDarkMode = false;\\nprivate FrameLayout rootContainer;\\nprivate TextView dateTitleView;\\nprivate TextView timeSubView;\\nprivate HorizontalScrollView filmstripScroll;\\nprivate LinearLayout filmstripTrack;\\nprivate FrameLayout cardWrapper;\\nprivate ImageView mainImageView;\\nprivate View deleteHintPill;\\nprivate TextView trashBtnText;\\nprivate TextView favBtnText;\\nprivate TextView undoBtnText;\\nprivate TextView toastPill;\\nprivate float downX, downY;\\nprivate float zoomScale = 1.0f;\\nprivate boolean isZooming = false;\\nprivate ScaleGestureDetector scaleDetector;\\nprivate String currentLoadingUri = \\\"\\\";\\nprivate final ExecutorService executor = Executors.newFixedThreadPool(4);\\nprivate final Handler mainHandler = new Handler(Looper.getMainLooper());\\nprivate LruCache<String, Bitmap> thumbCache;\\nprivate final SimpleDateFormat dateFmt = new SimpleDateFormat(\\\"yyyy年M月d日\\\", Locale.CHINA);\\nprivate final SimpleDateFormat timeFmt = new SimpleDateFormat(\\\"HH:mm\\\", Locale.CHINA);\\n@Override protected void onCreate(Bundle savedInstanceState) {\\nsuper.onCreate(savedInstanceState);\\nprefs = getSharedPreferences(\\\"swipe_cleaner_prefs\\\", MODE_PRIVATE);\\norganizedIds = new HashSet<String>(prefs.getStringSet(\\\"organized_ids\\\", new HashSet<String>()));\\nfavIds = new HashSet<String>(prefs.getStringSet(\\\"fav_ids\\\", new HashSet<String>()));\\nsortOrder = prefs.getInt(\\\"sort_order\\\", 0);\\nonlyUnorganized = prefs.getBoolean(\\\"only_unorganized\\\", true);\\nisDarkMode = prefs.getBoolean(\\\"dark_mode\\\", false);\\nint maxMem = (int) (Runtime.getRuntime().maxMemory() / 1024);\\nthumbCache = new LruCache<String, Bitmap>(maxMem / 8) { @Override protected int sizeOf(String key, Bitmap bmp) { return bmp.getByteCount() / 1024; } };\\nscaleDetector = new ScaleGestureDetector(this, new ScaleGestureDetector.SimpleOnScaleGestureListener() {\\n@Override public boolean onScaleBegin(ScaleGestureDetector detector) { isZooming = true; return true; }\\n@Override public boolean onScale(ScaleGestureDetector detector) { zoomScale = Math.max(1.0f, Math.min(4.0f, zoomScale * detector.getScaleFactor())); if (mainImageView != null) { mainImageView.setScaleX(zoomScale); mainImageView.setScaleY(zoomScale); } return true; }\\n@Override public void onScaleEnd(ScaleGestureDetector detector) { zoomScale = 1.0f; if (mainImageView != null) { mainImageView.animate().scaleX(1.0f).scaleY(1.0f).setDuration(180).start(); } mainHandler.postDelayed(() -> isZooming = false, 180); }\\n});\\nrootContainer = new FrameLayout(this);\\nsetContentView(rootContainer);\\ncheckPermAndLoad();\\n}\\nprivate int dp(int v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }\\nprivate GradientDrawable roundRect(int fillColor, int radiusDp, int strokeColor, int strokeWidthDp) { GradientDrawable gd = new GradientDrawable(); gd.setColor(fillColor); gd.setCornerRadius(dp(radiusDp)); if (strokeWidthDp > 0) gd.setStroke(dp(strokeWidthDp), strokeColor); return gd; }\\nprivate void checkPermAndLoad() { String perm = Build.VERSION.SDK_INT >= 33 ? \\\"android.permission.READ_MEDIA_IMAGES\\\" : Manifest.permission.READ_EXTERNAL_STORAGE; if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(perm) != PackageManager.PERMISSION_GRANTED) { requestPermissions(new String[]{perm}, 1001); } else { loadLibraryAsync(); } }\\n@Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) { if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) { loadLibraryAsync(); } else { showPermissionGuide(); } }\\nprivate void showPermissionGuide() { rootContainer.removeAllViews(); int bg = isDarkMode ? 0xFF121214 : 0xFFF2F2F7; int fg = isDarkMode ? 0xFFFFFFFF : 0xFF1C1C1E; rootContainer.setBackgroundColor(bg); LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setGravity(Gravity.CENTER); box.setPadding(dp(32), dp(32), dp(32), dp(32)); TextView tv = new TextView(this); tv.setText(\\\"需要访问相册权限以进行滑卡清理照片\\\"); tv.setTextColor(fg); tv.setTextSize(16); tv.setGravity(Gravity.CENTER); Button btn = new Button(this); btn.setText(\\\"重新授权\\\"); btn.setOnClickListener(v -> checkPermAndLoad()); box.addView(tv); box.addView(btn); rootContainer.addView(box, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); }\\nprivate void loadLibraryAsync() { rootContainer.removeAllViews(); int bg = isDarkMode ? 0xFF121214 : 0xFFF2F2F7; rootContainer.setBackgroundColor(bg); ProgressBar pb = new ProgressBar(this); rootContainer.addView(pb, new FrameLayout.LayoutParams(dp(48), dp(48), Gravity.CENTER)); executor.execute(() -> { List<PhotoItem> list = new ArrayList<PhotoItem>(); Map<String, AlbumInfo> bucketMap = new LinkedHashMap<String, AlbumInfo>(); AlbumInfo screenshotAlbum = new AlbumInfo(); screenshotAlbum.id = \\\"SCREENSHOTS\\\"; screenshotAlbum.title = \\\"截屏\\\"; String[] proj = new String[]{ MediaStore.Images.Media._ID, MediaStore.Images.Media.DATE_ADDED, MediaStore.Images.Media.DATE_TAKEN, MediaStore.Images.Media.SIZE, MediaStore.Images.Media.BUCKET_ID, MediaStore.Images.Media.BUCKET_DISPLAY_NAME }; try (Cursor c = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, proj, null, null, MediaStore.Images.Media.DATE_ADDED + \\\" DESC\\\")) { if (c != null) { int idCol = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID); int addCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_ADDED); int takeCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.DATE_TAKEN); int sizeCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.SIZE); int bIdCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.BUCKET_ID); int bNameCol = c.getColumnIndexOrThrow(MediaStore.Images.Media.BUCKET_DISPLAY_NAME); while (c.moveToNext()) { long id = c.getLong(idCol); long taken = c.getLong(takeCol); long added = c.getLong(addCol) * 1000L; PhotoItem item = new PhotoItem(); item.id = id; item.uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id); item.dateMs = taken > 0 ? taken : added; item.sizeBytes = Math.max(0, c.getLong(sizeCol)); item.bucketId = c.getString(bIdCol) != null ? c.getString(bIdCol) : \\\"OTHER\\\"; item.bucketName = c.getString(bNameCol) != null ? c.getString(bNameCol) : \\\"其他相册\\\"; list.add(item); String lower = item.bucketName.toLowerCase(Locale.ROOT); if (lower.contains(\\\"screenshot\\\") || lower.contains(\\\"截屏\\\") || lower.contains(\\\"截图\\\")) { screenshotAlbum.count++; if (screenshotAlbum.cover == null) screenshotAlbum.cover = item; } AlbumInfo alb = bucketMap.get(item.bucketId); if (alb == null) { alb = new AlbumInfo(); alb.id = item.bucketId; alb.title = item.bucketName; alb.cover = item; bucketMap.put(item.bucketId, alb); } alb.count++; } } } catch (Exception ignored) {} List<AlbumInfo> builtAlbums = new ArrayList<AlbumInfo>(); AlbumInfo allAlb = new AlbumInfo(); allAlb.id = \\\"ALL_PHOTOS\\\"; allAlb.title = \\\"全部相册\\\"; allAlb.count = list.size(); allAlb.cover = list.isEmpty() ? null : list.get(0); builtAlbums.add(allAlb); if (screenshotAlbum.count > 0) builtAlbums.add(screenshotAlbum); builtAlbums.addAll(bucketMap.values()); mainHandler.post(() -> { allPhotos = list; albums = builtAlbums; if (selectedAlbum == null && !albums.isEmpty()) selectedAlbum = albums.get(0); applyFilterAndSort(); buildMainUI(); }); }); }\\nprivate void applyFilterAndSort() { Set<String> trashSet = new HashSet<String>(); for (PhotoItem t : trashAssets) trashSet.add(t.uri.toString()); List<PhotoItem> filtered = new ArrayList<PhotoItem>(); String albId = selectedAlbum != null ? selectedAlbum.id : \\\"ALL_PHOTOS\\\"; for (PhotoItem p : allPhotos) { String key = p.uri.toString(); if (trashSet.contains(key)) continue; if (onlyUnorganized && organizedIds.contains(key)) continue; if (\\\"SCREENSHOTS\\\".equals(albId)) { String lower = p.bucketName.toLowerCase(Locale.ROOT); if (!lower.contains(\\\"screenshot\\\") && !lower.contains(\\\"截屏\\\") && !lower.contains(\\\"截图\\\")) continue; } else if (!\\\"ALL_PHOTOS\\\".equals(albId) && !albId.equals(p.bucketId)) { continue; } filtered.add(p); } if (sortOrder == 1) { Collections.reverse(filtered); } else if (sortOrder == 2) { Collections.shuffle(filtered); } displayAssets = filtered; if (currentIndex >= displayAssets.size()) { currentIndex = Math.max(0, displayAssets.size() - 1); } }\\nprivate void saveOrganized() { prefs.edit().putStringSet(\\\"organized_ids\\\", new HashSet<String>(organizedIds)).apply(); }\\nprivate void buildMainUI() { rootContainer.removeAllViews(); int bg = isDarkMode ? 0xFF000000 : 0xFFF2F2F7; int cardBg = isDarkMode ? 0xFF1C1C1E : 0xFFFFFFFF; int fg = isDarkMode ? 0xFFFFFFFF : 0xFF1C1C1E; int subFg = isDarkMode ? 0xFF8E8E93 : 0xFF6C6C70; rootContainer.setBackgroundColor(bg); LinearLayout mainCol = new LinearLayout(this); mainCol.setOrientation(LinearLayout.VERTICAL); mainCol.setPadding(dp(16), dp(14), dp(16), dp(14)); LinearLayout topBar = new LinearLayout(this); topBar.setOrientation(LinearLayout.HORIZONTAL); topBar.setGravity(Gravity.CENTER_VERTICAL); topBar.addView(makeCircleBtn(\\\"⚙️\\\", cardBg, fg, v -> showSettingsDialog())); LinearLayout titleBox = new LinearLayout(this); titleBox.setOrientation(LinearLayout.VERTICAL); titleBox.setGravity(Gravity.CENTER); dateTitleView = new TextView(this); dateTitleView.setTextSize(16); dateTitleView.setTypeface(Typeface.DEFAULT_BOLD); dateTitleView.setTextColor(fg); dateTitleView.setGravity(Gravity.CENTER); timeSubView = new TextView(this); timeSubView.setTextSize(12); timeSubView.setTextColor(subFg); timeSubView.setGravity(Gravity.CENTER); titleBox.addView(dateTitleView); titleBox.addView(timeSubView); topBar.addView(titleBox, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)); TextView shareBtn = makeCircleBtn(\\\"📤\\\", cardBg, fg, v -> shareCurrent()); LinearLayout.LayoutParams sLp = new LinearLayout.LayoutParams(dp(40), dp(40)); sLp.rightMargin = dp(8); topBar.addView(shareBtn, sLp); topBar.addView(makeCircleBtn(\\\"📁\\\", cardBg, fg, v -> showAlbumPickerDialog())); mainCol.addView(topBar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)); filmstripScroll = new HorizontalScrollView(this); filmstripScroll.setHorizontalScrollBarEnabled(false); filmstripTrack = new LinearLayout(this); filmstripTrack.setOrientation(LinearLayout.HORIZONTAL); filmstripScroll.addView(filmstripTrack); LinearLayout.LayoutParams stripLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(62)); stripLp.topMargin = dp(10); stripLp.bottomMargin = dp(10); mainCol.addView(filmstripScroll, stripLp); FrameLayout centerArea = new FrameLayout(this); cardWrapper = new FrameLayout(this); cardWrapper.setBackground(roundRect(cardBg, 24, 0, 0)); cardWrapper.setPadding(dp(10), dp(10), dp(10), dp(10)); mainImageView = new ImageView(this); mainImageView.setScaleType(ImageView.ScaleType.FIT_CENTER); cardWrapper.addView(mainImageView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); TextView delPill = new TextView(this); delPill.setText(\\\"🗑 松开移入待删除\\\"); delPill.setTextColor(Color.WHITE); delPill.setTextSize(13); delPill.setTypeface(Typeface.DEFAULT_BOLD); delPill.setPadding(dp(16), dp(8), dp(16), dp(8)); delPill.setBackground(roundRect(0xE6FF3B30, 20, 0, 0)); delPill.setVisibility(View.GONE); FrameLayout.LayoutParams pillLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP | Gravity.CENTER_HORIZONTAL); pillLp.topMargin = dp(16); cardWrapper.addView(delPill, pillLp); deleteHintPill = delPill; setupCardTouch(); centerArea.addView(cardWrapper, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); mainCol.addView(centerArea, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)); LinearLayout bottomBar = new LinearLayout(this); bottomBar.setOrientation(LinearLayout.HORIZONTAL); bottomBar.setGravity(Gravity.CENTER_VERTICAL); LinearLayout.LayoutParams botLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(56)); botLp.topMargin = dp(12); LinearLayout leftCapsule = new LinearLayout(this); leftCapsule.setOrientation(LinearLayout.HORIZONTAL); leftCapsule.setBackground(roundRect(cardBg, 16, isDarkMode ? 0x22FFFFFF : 0x15000000, 1)); leftCapsule.setGravity(Gravity.CENTER_VERTICAL); trashBtnText = new TextView(this); trashBtnText.setGravity(Gravity.CENTER); trashBtnText.setTextSize(15); trashBtnText.setTypeface(Typeface.DEFAULT_BOLD); trashBtnText.setTextColor(fg); trashBtnText.setOnClickListener(v -> commitBatchDelete(null)); leftCapsule.addView(trashBtnText, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)); View div = new View(this); div.setBackgroundColor(isDarkMode ? 0x33FFFFFF : 0x22000000); leftCapsule.addView(div, new LinearLayout.LayoutParams(dp(1), dp(22))); TextView eyeBtn = new TextView(this); eyeBtn.setText(\\\"👁\\\"); eyeBtn.setGravity(Gravity.CENTER); eyeBtn.setTextSize(17); eyeBtn.setOnClickListener(v -> showTrashDialog()); leftCapsule.addView(eyeBtn, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f)); bottomBar.addView(leftCapsule, new LinearLayout.LayoutParams(0, dp(54), 1f)); favBtnText = new TextView(this); favBtnText.setGravity(Gravity.CENTER); favBtnText.setTextSize(22); favBtnText.setOnClickListener(v -> toggleFavorite()); LinearLayout.LayoutParams favLp = new LinearLayout.LayoutParams(dp(56), dp(54)); favLp.leftMargin = dp(10); favLp.rightMargin = dp(10); bottomBar.addView(favBtnText, favLp); undoBtnText = new TextView(this); undoBtnText.setText(\\\"↩\\\"); undoBtnText.setGravity(Gravity.CENTER); undoBtnText.setTextSize(20); undoBtnText.setTypeface(Typeface.DEFAULT_BOLD); undoBtnText.setTextColor(fg); undoBtnText.setBackground(roundRect(cardBg, 16, isDarkMode ? 0x22FFFFFF : 0x15000000, 1)); undoBtnText.setOnClickListener(v -> undoLastAction()); bottomBar.addView(undoBtnText, new LinearLayout.LayoutParams(0, dp(54), 1f)); mainCol.addView(bottomBar, botLp); rootContainer.addView(mainCol, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); toastPill = new TextView(this); toastPill.setTextColor(Color.WHITE); toastPill.setTextSize(14); toastPill.setTypeface(Typeface.DEFAULT_BOLD); toastPill.setPadding(dp(22), dp(11), dp(22), dp(11)); toastPill.setBackground(roundRect(0xD9000000, 24, 0, 0)); toastPill.setVisibility(View.GONE); FrameLayout.LayoutParams tLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL); tLp.bottomMargin = dp(86); rootContainer.addView(toastPill, tLp); refreshAllViews(); }\\nprivate TextView makeCircleBtn(String icon, int bg, int fg, View.OnClickListener listener) { TextView tv = new TextView(this); tv.setText(icon); tv.setTextSize(16); tv.setTextColor(fg); tv.setGravity(Gravity.CENTER); tv.setBackground(roundRect(bg, 21, 0, 0)); tv.setLayoutParams(new LinearLayout.LayoutParams(dp(42), dp(42))); tv.setOnClickListener(listener); return tv; }\\nprivate void setupCardTouch() { cardWrapper.setOnTouchListener((v, ev) -> { scaleDetector.onTouchEvent(ev); if (isZooming || ev.getPointerCount() > 1) { deleteHintPill.setVisibility(View.GONE); return true; } switch (ev.getActionMasked()) { case MotionEvent.ACTION_DOWN: downX = ev.getRawX(); downY = ev.getRawY(); break; case MotionEvent.ACTION_MOVE: float dx = ev.getRawX() - downX; floa